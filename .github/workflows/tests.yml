name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}${{ matrix.deps == 'lowest' && ' / lowest deps' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
        symfony: [ '^5.4', '^6.4' ]
        deps: [ highest, lowest ]
    steps:
    - uses: actions/checkout@v5

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: json
        coverage: none
        tools: composer:v2

    - name: Install dependencies
      run: |
        composer require 'symfony/framework-bundle:${{ matrix.symfony }}' --no-update
        composer require --dev \
          'symfony/twig-bundle:${{ matrix.symfony }}' \
          'symfony/yaml:${{ matrix.symfony }}' \
          --no-update
        composer update --prefer-dist --no-progress --no-security-blocking ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

    - name: Installed versions
      run: composer show | grep -E '^(symfony/(framework-bundle|http-kernel|twig-bundle)|twig/twig|phpunit/phpunit) '

    - name: PHPUnit
      run: composer test
